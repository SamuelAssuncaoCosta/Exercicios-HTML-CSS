<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de houver</title>
    <style>
        body{
            background-color: lightgrey;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;            
        }
        div > p {
            display: none;
        }
        div:hover > p {
            display: block;
            color: white;
            background-color: red;
        }
        div:hover{
            color: red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de houver</h1>
    <p>passe o mouse no texto abaixo</p>
    <div>passe o mouse em cima para ver o efeito
        <p>texto escondido</p>
    </div>
    
    
</body>
</html>
