<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixa</title>
    <style>
        h1{
            background-color: lightgrey;
            height: 300px;
            width: 300px;
            border: 10px solid black;
            padding: 10px 10px 10px 10px;
            margin: 20px auto 40px auto;
            outline: 5px dashed salmon;

        }
        a{
            border-radius: 10px;
            border-style: solid;
            border-color: red;
        }
    </style>
</head>
<body>
    <h1>exemplo de caixa box level</h1>
    <p>páragrafos também são exemplos de box-levels, mas os <a href="#">links são 
    exemplos de elementos inline.</a> vamos ver como isso funciona.</p>
    
</body>
</html>
