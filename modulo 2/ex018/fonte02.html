<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'Olondona';
            src: url('Olondon_.otf') format('opentype'),
            url('OldLondonAlternate.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
           
        /* tipos de formato: truetype(ttf), opentype (otf), 
        woff, woff2, svg 
        procurar fontes em sites: font ninja*/
        }
        body{
            font-family: 'arial', sans-serif;
            font-size: 16px;
            color: black;
        }
        h1{
            font-family: 'Olondona', Times, serif;
            font-size: 36px;
        }
    </style>
</head>
<body>
    <h1>titulo</h1>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Voluptatibus dolore provident explicabo harum cumque dolor placeat atque obcaecati et, aut impedit odio? Eveniet excepturi molestiae eum animi quod sit commodi.</p>
    
    
</body>
</html>
